[package]
name = "andex-market"
version = "4.0.0"
description = "Sistema de punto de venta AndexMarket"
authors = ["AndexTech"]
edition = "2021"

[workspace]
members = ["impresion"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
impresion = { path = "impresion" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serialport = "4"
base64 = "0.22"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
