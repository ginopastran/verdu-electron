[package]
name = "actualizador"
version = "0.1.0"
edition = "2021"

[features]
firmar = ["dep:minisign"]

[dependencies]
base64 = "0.22"
minisign = { version = "=0.7.3", optional = true }
minisign-verify = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
serde_json = "1"

[dev-dependencies]
minisign = "=0.7.3"

[[bin]]
name = "firmar"
required-features = ["firmar"]
